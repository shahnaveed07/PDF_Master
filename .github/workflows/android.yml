name: Android CI & Release Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build, Test, Lint & Verify Release
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 4. Clean and Run Unit & Robolectric Tests
        run: ./gradlew clean :app:testDebugUnitTest

      - name: 5. Run Android Lint
        run: ./gradlew :app:lintDebug

      - name: 6. Run Static Analysis (Detekt)
        run: ./gradlew :app:detekt

      - name: 7. Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: 8. Build Release AAB & APK
        run: ./gradlew :app:bundleRelease :app:assembleRelease

      - name: 9. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-master-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 10. Upload Release Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-master-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: 11. Upload Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/detekt/
          if-no-files-found: ignore
